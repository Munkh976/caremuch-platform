server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: any path that isn't a real static file (e.g.
    # /a/ripple-effects on a direct load or a hard refresh, not just navigated to
    # from "/") falls through to index.html so react-router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite -- safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
